<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Команда установки</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#0c1018;color:#edf2fa;font:16px system-ui,sans-serif}main{width:min(780px,100%)}.label{color:#89b4ff;font-size:12px;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(32px,6vw,52px);letter-spacing:-.045em;margin:18px 0}p{color:#98a5ba;line-height:1.6}.terminal{margin-top:32px;border:1px solid #293346;border-radius:18px;background:#141b27;overflow:hidden}.bar{padding:16px 22px;border-bottom:1px solid #293346;font-size:13px;color:#98a5ba}pre{margin:0;padding:26px 22px;white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.8 ui-monospace,Consolas,monospace;color:#c9e0ff}.actions{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:22px}button{background:#a8c7ff;border:0;border-radius:10px;padding:14px 22px;font:600 15px system-ui;cursor:pointer;color:#10203a}button:hover{background:#c3d8ff}button:focus-visible{outline:3px solid white;outline-offset:4px}#status{color:#a5d6b3;font-size:14px;min-height:22px}</style></head><body><main><div class="label">Screenshot Analyzer</div><h1>Команда под рукой.</h1><p>Нажмите кнопку, чтобы скопировать команду.</p><div class="terminal"><div class="bar">PowerShell</div><pre id="command">irm https://raw.githubusercontent.com/massoniwe/screenshot-analyzer/main/install.ps1 | iex</pre></div><div class="actions"><button id="copy" type="button">Скопировать команду</button><span id="status" role="status" aria-live="polite"></span></div></main><script>
document.getElementById('copy').addEventListener('click',async()=>{const text=document.getElementById('command').textContent;const status=document.getElementById('status');try{await navigator.clipboard.writeText(text);status.textContent='Скопировано!';}catch{const selection=window.getSelection();const range=document.createRange();range.selectNodeContents(document.getElementById('command'));selection.removeAllRanges();selection.addRange(range);status.textContent='Нажмите Ctrl+C, чтобы скопировать выделенную команду.';}});
</script></body></html>
